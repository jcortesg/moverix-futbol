name: Mobile — CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  ci:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moverix/mobile lint

  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Build Android
        working-directory: apps/mobile
        run: eas build --platform android --non-interactive --profile production

  build-ios:
    name: Build iOS (EAS)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Build iOS
        working-directory: apps/mobile
        run: eas build --platform ios --non-interactive --profile production
