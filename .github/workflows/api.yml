name: API — CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - 'packages/**'

env:
  GCP_PROJECT_ID: moverix
  GCP_PROJECT_NUMBER: "444229586513"
  GCP_REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/moverix/moverix/api
  SERVICE_NAME: moverix-api

jobs:
  # ─── CI: Lint y Tests ──────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moverix/api lint
      - run: pnpm --filter @moverix/api test

  # ─── CD: Build y Deploy ────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      id-token: write  # Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/444229586513/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Set environment tag
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ env.IMAGE }}:${{ steps.env.outputs.tag }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.env.outputs.tag }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-${{ steps.env.outputs.env }} \
            --image ${{ env.IMAGE }}:${{ steps.env.outputs.tag }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=${{ steps.env.outputs.env }} \
            --set-secrets DATABASE_URL=moverix-db-url:latest,FIREBASE_PROJECT_ID=moverix-firebase-project:latest,CORS_ORIGINS=moverix-cors-origins:latest,GCS_BUCKET=moverix-gcs-bucket:latest \
            --set-env-vars API_BASE_URL=https://api-ftb.moverix.co \
            --add-cloudsql-instances moverix:us-central1:moverix-db \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --port 3001
