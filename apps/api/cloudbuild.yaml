steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/moverix/moverix/api:manual-deploy
      - -t
      - us-central1-docker.pkg.dev/moverix/moverix/api:latest
      - .

images:
  - us-central1-docker.pkg.dev/moverix/moverix/api:manual-deploy
  - us-central1-docker.pkg.dev/moverix/moverix/api:latest

logsBucket: gs://moverix_cloudbuild/logs

options:
  machineType: E2_HIGHCPU_8
  logging: GCS_ONLY
